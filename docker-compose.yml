version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: app
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
      - ../storage:/var/www/storage:cached
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    networks:
      - app-network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "3020:80"
    volumes:
      - .:/var/www/html:ro,cached
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../storage:/var/www/storage:ro,cached
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "3022:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"
    networks:
      - app-network

  queue:
      build:
        context: .
        dockerfile: .docker/Dockerfile
      container_name: queue
      volumes:
          -   .:/var/www/html:cached
      networks:
            - app-network
      depends_on:
            - db
            - redis
      command: sh -c "supervisord -c /etc/supervisor/supervisord.conf"

  scheduler:
      build:
        context: .
        dockerfile: .docker/Dockerfile
      container_name: scheduler
      volumes:
          -   .:/var/www/html:cached
      networks:
            - app-network
      depends_on:
            - db
            - redis
      command: sh -c "while true; do php artisan schedule:run >> storage/logs/scheduler.log 2>&1; sleep 60; done"

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
