[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/www/storage/log/php-fpm.err.log
stdout_logfile=/var/www/storage/log/php-fpm.out.log

[program:cron]
command=cron -f
autostart=true
autorestart=true
stderr_logfile=/var/www/storage/log/cron.err.log
stdout_logfile=/var/www/storage/log/cron.out.log

[program:queue-worker]
command=php /var/www/artisan queue:work --daemon
autostart=true
autorestart=true
stderr_logfile=/var/www/storage/log/queue-worker.err.log
stdout_logfile=/var/www/storage/log/queue-worker.out.log
